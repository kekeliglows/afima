<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ── SEO PRIMAIRE ── -->
  <title>Catalogue — afima | Tous les produits disponibles</title>
  <meta name="description" content="Parcourez les produits disponibles sur Afima, recherchez une annonce et trouvez ce qu'il vous faut.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://afima-ruby.vercel.app/front-end/catalogue.html">

  <!-- ── OPEN GRAPH ── -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://afima-ruby.vercel.app/front-end/catalogue.html">
  <meta property="og:title" content="Catalogue — afima | Tous les produits disponibles">
  <meta property="og:description" content="Parcourez les produits disponibles sur Afima.">
  <meta property="og:image" content="https://afima-ruby.vercel.app/assets/logo.png">
  <meta property="og:locale" content="fr_FR">
  <meta property="og:site_name" content="afima">

  <!-- ── TWITTER CARD ── -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Catalogue — afima">
  <meta name="twitter:description" content="Parcourez les produits disponibles sur Afima.">
  <meta name="twitter:image" content="https://afima-ruby.vercel.app/assets/logo.png">

  <!-- ── FAVICON & THEME ── -->
  <link rel="icon" href="../assets/logo.png" type="image/png">
  <link rel="apple-touch-icon" href="../assets/logo.png">
  <meta name="theme-color" content="#111111">

  <!-- ── FONTS & CSS ── -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/index.css">
  <link rel="stylesheet" href="../css/catalogue.css">
  <link rel="stylesheet" href="../css/baham.css">

  <!-- ── JSON-LD ── -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "CollectionPage",
    "name": "Catalogue afima",
    "description": "Catalogue de produits de la marketplace afima",
    "url": "https://afima-ruby.vercel.app/front-end/catalogue.html",
    "isPartOf": { "@type": "WebSite", "name": "Afima", "url": "https://afima-ruby.vercel.app/" }
  }
  </script>

  <!-- ── SCRIPTS ── -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="../js/utils/currency.js"></script>
  <script src="../js/utils/wishlist.js"></script>
  <script src="../js/utils/baham.js"></script>
  <script src="../js/baham.js"></script>
  <script src="../js/catalogue.js" defer></script>
  <script>document.addEventListener('DOMContentLoaded', () => lucide.createIcons());</script>
</head>
<body>
  <header>
    <nav class="navigation" aria-label="Navigation principale">
      <a href="../index.html" class="logo">
        <img src="../assets/logo.png" alt="afima Logo" width="36" height="36">
        <span class="logo-text">afima</span>
      </a>

      <ul class="header_btn" id="navLinks">
        <li>
          <a href="dashboard.html" class="btn btn-outline">
            <i data-lucide="layout-dashboard"></i> Dashboard
          </a>
        </li>
        <li>
          <a href="profil.html" class="btn btn-outline">
            <i data-lucide="user"></i> Profil
          </a>
        </li>
        <li>
          <a href="ajouter-produit.html" class="btn btn-primary">
            <i data-lucide="plus"></i> Vendre
          </a>
        </li>
        <li>
          <a href="panier.html" class="btn btn-outline nav-cart">
            <i data-lucide="shopping-cart"></i>
            <span class="cart-badge hidden" id="cartBadge">0</span>
            Panier
          </a>
        </li>
        <li>
          <a href="commandes.html" class="btn btn-outline">
            <i data-lucide="package"></i> Mes commandes
          </a>
        </li>
        <li>
          <button class="btn btn-outline" id="btnLogout">
            <i data-lucide="log-out"></i> Déconnexion
          </button>
        </li>
      </ul>

      <button class="nav-toggle" id="navToggle" aria-label="Ouvrir le menu" aria-expanded="false" aria-controls="mobileMenu">
        <i data-lucide="menu" class="icon-menu"></i>
        <i data-lucide="x" class="icon-close hidden"></i>
      </button>
    </nav>

    <div class="mobile-menu hidden" id="mobileMenu" role="navigation" aria-label="Menu mobile">
      <a href="dashboard.html" class="mobile-link"><i data-lucide="layout-dashboard"></i> Dashboard</a>
      <a href="profil.html" class="mobile-link"><i data-lucide="user"></i> Profil</a>
      <a href="ajouter-produit.html" class="mobile-link mobile-link-primary">
        <i data-lucide="plus-circle"></i> Vendre un produit
      </a>
      <a href="panier.html" class="mobile-link">
        <i data-lucide="shopping-cart"></i> Panier
      </a>
      <a href="commandes.html" class="mobile-link">
        <i data-lucide="package"></i> Mes commandes
      </a>
      <button class="mobile-link mobile-link-danger" id="btnLogoutMobile">
        <i data-lucide="log-out"></i> Déconnexion
      </button>
    </div>
  </header>

  <main class="catalogue-main">
    <div class="catalogue-header">
      <h1>Catalogue</h1>
      <div class="catalogue-controls">
        <div class="search-wrapper">
          <i data-lucide="search" class="search-icon"></i>
          <input type="search" id="searchInput" placeholder="Rechercher un produit..." class="search-input" aria-label="Rechercher un produit">
        </div>
        <select id="currencySelect" class="sort-select" aria-label="Choisir une devise">
          <option value="EUR">€ EUR</option>
          <option value="USD">$ USD</option>
          <option value="XOF">FCFA XOF</option>
          <option value="XAF">FCFA XAF</option>
          <option value="MAD">DH MAD</option>
          <option value="NGN">₦ NGN</option>
          <option value="GHS">GH₵ GHS</option>
          <option value="TND">DT TND</option>
          <option value="DZD">DA DZD</option>
          <option value="EGP">E£ EGP</option>
          <option value="KES">KSh KES</option>
          <option value="ZAR">R ZAR</option>
        </select>
        <select id="sortSelect" class="sort-select" aria-label="Trier les produits">
          <option value="recent">Plus récents</option>
          <option value="prix-asc">Prix croissant</option>
          <option value="prix-desc">Prix décroissant</option>
        </select>
      </div>
    </div>

    <div id="message-box" class="hidden" role="alert"></div>
    <section class="wishlist-section" id="wishlistSection" aria-label="Produits favoris"></section>
    <div id="produits-grid" class="produits-grid" aria-live="polite">
      <div class="skeleton-grid">
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
      </div>
    </div>
  </main>

  <footer class="footer">
   <div class="footer-inner">
     <div class="footer-brand">
       <img src="../assets/logo.png" alt="afima">
       <span>afima</span>
     </div>
     <p>&copy; 2026 afima. Tous droits réservés.</p>
     <div class="footer-links">
       <a href="a-propos.html">À propos</a>
       <a href="faq.html">FAQ</a>
       <a href="conditions-utilisation.html">Conditions d'utilisation</a>
       <a href="politique-confidentialite.html">Politique de confidentialité</a>
     </div>
   </div>
 </footer>

  <script>lucide.createIcons();</script>
</body>
</html>
