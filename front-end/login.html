<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion — Afima</title>
  <meta name="description" content="Connectez-vous à votre compte Afima.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="../assets/logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/login.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="../js/login.js" defer></script>
</head>
<body>
  <main class="auth-right">
    <a href="../index.html" class="back-link"><i data-lucide="arrow-left"></i> Retour à l'accueil</a>
    <div class="auth-box">
      <div class="auth-header"><h1>Bon retour<span class="accent-dot">.</span></h1><p id="auth-subtitle">Connectez-vous pour continuer sur Afima.</p></div>
      <div id="auth-message" class="message-box hidden" role="alert" aria-live="polite"></div>
      <div id="loginVerification" class="verification-inline hidden" role="status">
        <i data-lucide="mail"></i><span>Votre adresse e-mail n'est pas encore confirmée. Vérifiez votre boîte mail pour activer votre compte Afima.</span>
        <button type="button" class="text-action" id="btnLoginResend">Renvoyer l'e-mail de confirmation</button>
      </div>
      <form id="loginForm" class="auth-form active" novalidate>
        <div class="input-group"><label for="loginEmail">Adresse e-mail</label><div class="input-wrap"><i data-lucide="mail" class="input-icon"></i><input type="email" id="loginEmail" placeholder="votre@email.com" required autocomplete="email"></div></div>
        <div class="input-group"><label for="loginPassword">Mot de passe</label><div class="input-wrap"><i data-lucide="lock" class="input-icon"></i><input type="password" id="loginPassword" required autocomplete="current-password"><button type="button" class="toggle-pw" data-target="loginPassword" aria-label="Afficher le mot de passe"><i data-lucide="eye"></i></button></div></div>
        <button type="submit" class="submit-btn" id="btnLogin"><span>Se connecter</span><i data-lucide="arrow-right"></i></button>
      </form>
      <div class="auth-divider"><span>ou</span></div>
      <button type="button" id="btn-google" class="btn-google"><img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" width="18"><span>Continuer avec Google</span></button>
      <p class="auth-footer-note">Vous n'avez pas encore de compte ? <a href="signup.html">Créer un compte</a></p>
    </div>
  </main>
  <script>lucide.createIcons();</script>
</body>
</html>
